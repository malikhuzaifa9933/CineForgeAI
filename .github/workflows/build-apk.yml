name: Build CineForge AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "CineForgeAI_Android_Project.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          unzip -q CineForgeAI_Android_Project.zip -d project
          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fix JVM target
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -o -name settings.gradle | head -1)")
          echo "Gradle project found at: $PROJECT_DIR"

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if [ -f "$APP_GRADLE" ]; then
            echo "Updating JVM targets in $APP_GRADLE"

            sed -i 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' "$APP_GRADLE"
            sed -i 's/jvmTarget = ["'\'']1\.8["'\'']/jvmTarget = "17"/g' "$APP_GRADLE"
            sed -i 's/jvmTarget = ["'\'']8["'\'']/jvmTarget = "17"/g' "$APP_GRADLE"

            echo "JVM target fix applied."
          else
            echo "ERROR: app/build.gradle.kts not found!"
            exit 1
          fi

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -o -name settings.gradle | head -1)")
          echo "Gradle project found at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CineForgeAI-debug-apk
          path: project/**/build/outputs/apk/**/*.apk
