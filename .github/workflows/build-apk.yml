name: Build CineForge AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - "CineForgeAI_Android_Project.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          unzip -q CineForgeAI_Android_Project.zip -d project
          echo "Extracted files:"
          find project -maxdepth 3 -type f | head -100

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CineForgeAI-debug-apk
          path: project/**/build/outputs/apk/**/*.apk
